# Sprawdzanie PR-ów i pushy na main: testy serwera, obraz Dockera i próbne zbudowanie aplikacji.
# Wydań tu nie ma: nową wersję wydaje się z własnego komputera przez npm run wydanie
# (frontend/scripts/wydanie.mjs), a ten workflow tylko sprawdza, że to się zbuduje i uruchomi.
name: Budowanie

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Serwer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zależności
        run: pip install -r backend/requirements.txt

      - name: Testy
        working-directory: backend
        run: python -m unittest discover -s tests -t .

      - name: Obraz Dockera
        run: docker build -t orlog-server backend

      - name: Serwer w kontenerze odpowiada
        run: |
          docker run -d --name orlog -p 5000:5000 orlog-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then exit 0; fi
            sleep 1
          done
          docker logs orlog
          exit 1

  # tak samo jak przy wydaniu z komputera: wszystko budowane na Linuksie, także pliki na Windowsa
  app:
    name: Aplikacja (budowanie na Linuksie)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zależności
        run: npm ci --no-audit --no-fund

      # instalator na Windowsa powstaje bez Wine (scripts/electron-builder.mjs), więc go tu nie ma
      - name: Instalatory (npm run wydanie bez wysyłania)
        run: |
          if command -v wine > /dev/null; then echo "Wine nie powinno być w systemie: $(command -v wine)"; exit 1; fi
          npm run wydanie -- --bez-wysylania

      - name: Test uruchomienia
        run: xvfb-run -a release/linux-unpacked/orlog --no-sandbox --disable-gpu --smoke-test=smoke-linux.png

      - name: Test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x release/*.AppImage
          xvfb-run -a release/Orlog-*.AppImage --disable-gpu --smoke-test="$PWD/smoke-linux-appimage.png"

      - name: Test aktualizacji
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash scripts/proba-aktualizacji.sh latest-linux.yml xvfb-run -a release/Orlog-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: orlog-linux
          if-no-files-found: error
          path: |
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/latest-linux.yml

      - uses: actions/upload-artifact@v4
        with:
          name: orlog-windows
          if-no-files-found: error
          path: |
            frontend/release/*.exe
            frontend/release/latest.yml
            frontend/release/*.blockmap

      # zrzuty ekranu z testów, osobno, żeby nie pobierać całych instalatorów
      - uses: actions/upload-artifact@v4
        with:
          name: zrzut-Linux
          if-no-files-found: error
          path: frontend/smoke-*.png

  # pliki na Windowsa zbudowane na Linuksie: instalacja i uruchomienie na prawdziwym Windowsie
  windows:
    name: Aplikacja (test na Windowsie)
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: orlog-windows
          path: frontend/release

      - name: Instalacja
        run: |
          ls -la release
          # bez okien instalatora; MSYS_NO_PATHCONV, żeby bash nie zamienił /S na ścieżkę
          MSYS_NO_PATHCONV=1 ./release/Orlog-Setup-*.exe /S
          programs="$(cygpath -u "$LOCALAPPDATA")/Programs"
          exe=
          for i in $(seq 1 60); do
            exe=$(find "$programs" -maxdepth 2 -name Orlog.exe 2> /dev/null | head -n 1)
            [ -n "$exe" ] && break
            sleep 1
          done
          if [ -z "$exe" ]; then echo "instalator nie zainstalował gry"; ls -la "$programs" || true; exit 1; fi
          sleep 3
          ls "$(dirname "$exe")"
          echo "ORLOG_EXE=$exe" >> "$GITHUB_ENV"

      - name: Test uruchomienia
        run: '"$ORLOG_EXE" --disable-gpu --smoke-test="$PWD/smoke-windows.png"'

      # plik do wysłania znajomemu, uruchomiony tak jak u niego: bez instalacji
      - name: Test przenośnego exe
        run: |
          ./release/Orlog-*-portable.exe --disable-gpu --smoke-test="$PWD/smoke-windows-portable.png"
          # przenośny exe najpierw się rozpakowuje, więc zrzut może pojawić się chwilę później
          for i in $(seq 1 60); do [ -f smoke-windows-portable.png ] && exit 0; sleep 1; done
          echo "brak zrzutu z przenośnego exe"; exit 1

      - name: Test aktualizacji
        run: bash scripts/proba-aktualizacji.sh latest.yml "$ORLOG_EXE"

      # deinstalator to jedyna część instalatora, którą na Linuksie robi się inaczej niż na Windowsie
      - name: Odinstalowanie
        run: |
          dir=$(dirname "$ORLOG_EXE")
          ls "$dir"
          MSYS_NO_PATHCONV=1 "$dir/Uninstall Orlog.exe" /S
          # deinstalator kopiuje się do katalogu tymczasowego i kończy pracę stamtąd
          for i in $(seq 1 60); do [ ! -e "$ORLOG_EXE" ] && { echo "odinstalowano"; exit 0; }; sleep 1; done
          echo "gra dalej jest zainstalowana"; ls -la "$dir"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: zrzut-Windows
          if-no-files-found: error
          path: frontend/smoke-*.png
