# Testy serwera, obraz Dockera i instalatory aplikacji (Windows, Linux).
# Przy tagu v* (np. v1.0.0) powstaje szkic wydania z instalatorami w zakładce Releases.
name: Budowanie

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Serwer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zależności
        run: pip install -r backend/requirements.txt

      - name: Testy
        working-directory: backend
        run: python -m unittest discover -s tests -t .

      - name: Obraz Dockera
        run: docker build -t orlog-server backend

      - name: Serwer w kontenerze odpowiada
        run: |
          docker run -d --name orlog -p 5000:5000 orlog-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then exit 0; fi
            sleep 1
          done
          docker logs orlog
          exit 1

  app:
    name: Aplikacja (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zależności
        run: npm ci --no-audit --no-fund

      # przy tagu v1.2.3 aplikacja dostaje wersję 1.2.3 (tak samo nazywa się wydanie)
      - name: Wersja z tagu
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Frontend
        run: npm run build
        env:
          # adres serwera wbudowany w aplikację: zmienna repozytorium ORLOG_SERVER_URL
          # (Settings → Secrets and variables → Actions → Variables); bez niej gracz wpisuje adres sam
          VITE_BACKEND_URL: ${{ vars.ORLOG_SERVER_URL }}

      - name: Instalatory
        run: npx electron-builder --publish never

      - name: Test uruchomienia (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a release/linux-unpacked/orlog --no-sandbox --disable-gpu --smoke-test=smoke-linux.png

      - name: Test uruchomienia (Windows)
        if: runner.os == 'Windows'
        run: release/win-unpacked/Orlog.exe --disable-gpu --smoke-test=smoke-windows.png

      # pliki do wysłania znajomemu, uruchomione tak jak u niego: bez instalacji
      - name: Test przenośnego exe (Windows)
        if: runner.os == 'Windows'
        run: |
          ./release/Orlog-*-portable.exe --disable-gpu --smoke-test="$PWD/smoke-windows-portable.png"
          # przenośny exe najpierw się rozpakowuje, więc zrzut może pojawić się chwilę później
          for i in $(seq 1 60); do [ -f smoke-windows-portable.png ] && exit 0; sleep 1; done
          echo "brak zrzutu z przenośnego exe"; exit 1

      - name: Test AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x release/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a release/Orlog-*.AppImage --disable-gpu --smoke-test="$PWD/smoke-linux-appimage.png"

      # udajemy nowsze wydanie (ten sam plik, wyższy numer w latest*.yml) i sprawdzamy,
      # czy zainstalowana aplikacja je znajdzie i pobierze
      - name: Test aktualizacji
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then yml=latest.yml; else yml=latest-linux.yml; fi
          mkdir -p update-feed
          sed 's/^version: .*/version: 99.0.0/' "release/$yml" > "update-feed/$yml"
          grep -E '^ *(- )?url:|^path:' "update-feed/$yml" | sed 's/.*: *//' | sort -u | while read -r f; do cp "release/$f" update-feed/; done
          ls update-feed
          python -m http.server 8099 --bind 127.0.0.1 --directory update-feed > feed.log 2>&1 &
          sleep 2
          export ORLOG_UPDATE_URL=http://127.0.0.1:8099
          if [ "$RUNNER_OS" = "Windows" ]; then
            release/win-unpacked/Orlog.exe --update-test --disable-gpu
          else
            chmod +x release/*.AppImage
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a release/Orlog-*.AppImage --update-test --disable-gpu
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orlog-${{ runner.os }}
          if-no-files-found: error
          path: |
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/*.exe
            frontend/release/latest*.yml
            frontend/release/*.blockmap

      # zrzut ekranu z testu uruchomienia, osobno, żeby nie pobierać całych instalatorów
      - uses: actions/upload-artifact@v4
        with:
          name: zrzut-${{ runner.os }}
          if-no-files-found: error
          path: frontend/smoke-*.png

  release:
    name: Wydanie
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Szkic wydania z instalatorami
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest*.yml i *.blockmap są potrzebne aplikacjom do aktualizacji
          shopt -s nullglob
          files=(artifacts/*/*.AppImage artifacts/*/*.deb artifacts/*/*.exe artifacts/*/latest*.yml artifacts/*/*.blockmap)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Orlog ${GITHUB_REF_NAME#v}" "${files[@]}"
